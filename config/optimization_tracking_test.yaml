optimization_tracking_test_node:
  ros__parameters:
    base_frame: rail_link
    publish_rate: 500.0
    startup_delay: 2.0

    # The node captures both home poses from TF before starting motion.
    left:
      frame: left_fr3_hand_tcp
      topic: /dual_arm_controller_wbc/target_pose/left
      velocity_topic: /dual_arm_controller_wbc/target_velocity/left
      current_pose_topic: /dual_arm_controller_wbc/current_pose/left
      delayed_target_topic: /dual_arm_controller_wbc/delayed_target_pose/left
      motion_type: linear
      linear_direction: [1.0, 0.0, 0.0]
      linear_amplitude: 0.15
      linear_speed: 0.2
      circle_axis_u: [1.0, 0.0, 0.0]
      circle_axis_v: [0.0, 1.0, 0.0]
      circle_radius: 0.05
      circle_speed: 0.5

    right:
      frame: right_fr3_hand_tcp
      topic: /dual_arm_controller_wbc/target_pose/right
      delayed_target_topic: /dual_arm_controller_wbc/delayed_target_pose/right
      current_pose_topic: /dual_arm_controller_wbc/current_pose/right
      velocity_topic: /dual_arm_controller_wbc/target_velocity/right
      motion_type: circular
      linear_direction: [1.0, 0.0, 0.0]
      linear_amplitude: 0.15
      linear_speed: 0.1
      circle_axis_u: [1.0, 0.0, 0.0]
      circle_axis_v: [0.0, 1.0, 0.0]
      circle_radius: 0.1
      circle_speed: 0.15
